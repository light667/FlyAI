name: flyai
description: "Fly AI — AI-powered scholarship matching platform. Swipe. Match. Apply. Fly."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons & Splash
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # Animation
  lottie: ^3.3.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Apple Sign-In
  sign_in_with_apple: ^6.1.1

  # Supabase
  supabase_flutter: ^2.7.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.3.0

  # Local DB / Cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Fonts
  google_fonts: ^6.2.1

  # HTTP / Networking
  http: ^1.2.2
  dio: ^5.7.0

  # File / Image Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # UI Utilities
  percent_indicator: ^4.2.3
  flutter_card_swiper: ^7.0.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  universal_html: ^2.2.4
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  ios: true
  background_color: "#0F172A"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lotties/