name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (Render free tier spins down after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          # Replace with your actual Render deployment URL (e.g. https://flyai-backend.onrender.com)
          RENDER_URL="https://flyai-backend.onrender.com/health"
          echo "Pinging $RENDER_URL..."
          curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL"
